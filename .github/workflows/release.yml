name: Release

# On every push to master release-please keeps a release PR up to date (version bump + changelog,
# from Conventional Commits). Merging that PR creates the tag and the GitHub release, then the
# build below is attached to it. The zip name is fixed so that
# https://github.com/talgrim/OpenSubtitleFetcher/releases/latest/download/OpenSubtitleFetcher-win-x64.zip
# always points at the newest release.
# (The build is a job of this workflow because tags made with GITHUB_TOKEN do not start other workflows.)
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test OpenSubtitleFetcher.sln -c Release

      # Self-contained, so users do not need to install the .NET runtime.
      # Built from a clean checkout, so appsettings.Local.json (the API key) is never included.
      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          dotnet publish OpenSubtitleFetcher.Wpf/OpenSubtitleFetcher.Wpf.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$env:VERSION -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath OpenSubtitleFetcher-win-x64.zip

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" OpenSubtitleFetcher-win-x64.zip --clobber
